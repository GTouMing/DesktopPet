name: pet_floating_window
description: "Android multi floating-window plugin for DesktopPet: one system overlay per pet, each running its own Flutter engine."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.desktop_pet.pet_floating_window
        pluginClass: PetFloatingWindowPlugin
