name: desktop_pet
description: "Add a desktop pet to your Windows and Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.3.1
  mmkv: ^2.4.0
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  system_tray: ^2.0.0
  path_provider: ^2.1.0
  archive: ^4.0.9
  file_picker: ^11.0.2
  win32: ^5.0.0
  ffi: ^2.0.0
  desktop_multi_window: ^0.3.0
  flutter_alone: ^4.1.0
  audioplayers: ^6.1.0
  styled_widget: ^0.4.1
  # 自研 Live2D 渲染器（进程级运行时 + 定尺寸渲染目标 + 预热切换）。
  # 取代了 live2d_flutter：后者的架构与本项目不合（模型归视图所有、重注册会破坏
  # 引擎持有的纹理对象、渲染目标尺寸只能创建时确定），我们为它打过的补丁已沉淀在
  # doc/live2d-renderer-notes.md 与 plugins/pet_live2d/ 里。
  pet_live2d:
    path: plugins/pet_live2d
  # Android 多悬浮窗插件（每只桌宠一个系统悬浮窗、各自一个引擎）。
  # 从 lib/platform/android/multi_floating_window/ 抽出为独立插件，并改名以避开
  # pub.dev 上同名的通用多悬浮窗包。
  pet_floating_window:
    path: plugins/pet_floating_window

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/default_pet_pack/
    - assets/app_icon.ico
    - assets/default_pet_pack/drag/
    - assets/default_pet_pack/eat/
    - assets/default_pet_pack/happy/
    - assets/default_pet_pack/idle/
    - assets/default_pet_pack/sleep/
    - assets/default_pet_pack/walk/
  generate: true # 务必开启此选项，以启用代码生成器
